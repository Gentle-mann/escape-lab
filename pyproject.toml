[project]
name = "escape-lab"
version = "0.1.0"
description = "Evidence-grounded retrospective FGFR resistance audits"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2", "biopython>=1.85,<2", "openpyxl>=3.1,<4",
  "pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "httpx>=0.28,<1", "openai>=1.70,<3", "python-dotenv>=1,<2"
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[project.scripts]
escape-lab = "escape_lab.cli:main"
